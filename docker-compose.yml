services:
  app:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      # Mount the project from the host, including node_modules installed with Bun
      - .:/app
    # VITE_* vars are read by Vite from the mounted .env / .env.local files.
    # Do not set them here: compose only substitutes from .env (not .env.local),
    # and container env vars override Vite's file-based loading.
    # Shared gateway secrets (GATEWAY_JWT_SECRET, GATEWAY_AUTH_REQUIRED) must match across
    # gateway, api, payment, printer, and tracking. Put them in each service's `.env.local`
    # (or project root `.env.local` for sidecars). Do NOT rely on the dev default below —
    # docker `environment:` overrides `env_file`, so gateway JWT vars are env_file-only.
    # Dev mode with Bun + Vite, binding to all interfaces.
    # Assumes you've already run `bun install` on the host.
    command: sh -c "bun run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Server-side Vite proxy target for the customer QR page. The browser
      # still uses VITE_GATEWAY_URL (http://localhost:3142) from .env.local;
      # this only affects the proxy running inside this container, where
      # "localhost" is the app itself — the gateway is reachable as "gateway".
      - SELF_ORDER_GATEWAY_URL=http://gateway:3142
    ports:
      - "5173:5173"
    depends_on:
      - dbproxy
      - printer
      - payment
      - sync
      - tracking
      - api
      - gateway

  postgres:
    image: postgres:16-alpine
    # The single system of record. All app data lives in the "records" JSONB
    # store owned by the dbproxy service (see dbproxy/README.md).
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-restaurant_manager}
    ports:
      # Overridable because 5432 is often taken on dev machines. Containers
      # always reach postgres:5432 on the compose network regardless.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-restaurant_manager}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dbproxy:
    # PostgreSQL-backed data service speaking the same /rpc WebSocket wire
    # protocol the SurrealDB server used to expose. Every container talks to
    # dbproxy:8000 exactly like it talked to surrealdb:8000 before.
    build:
      context: ./dbproxy
      dockerfile: Dockerfile
    image: restaurant-manager-dbproxy:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-restaurant_manager}
      - DB_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DB_PASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_ROOT_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - DB_ROOT_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - DB_TOKEN_SECRET=${GATEWAY_JWT_SECRET:?Set GATEWAY_JWT_SECRET in .env}
      - DBPROXY_PORT=8000
      - DBPROXY_HOST=0.0.0.0
    ports:
      - "${SURREAL_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  printer:
    build:
      context: ./printing
      dockerfile: Dockerfile
    image: restaurant-manager-printer:latest
    working_dir: /app
    env_file:
      - path: ./api/.env
        required: false
      - path: ./api/.env.local
        required: false
      - path: ./.env.local
        required: false
    volumes:
      - ./printing:/app
      - printer-node_modules:/app/node_modules
    environment:
      - PRINT_PORT=3132
      - PRINT_HOST=0.0.0.0
      - TZ=${VITE_APP_TIMEZONE:-UTC}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: sh -c "npm install && node server.js"
    ports:
      - "3132:3132"
    # USB printer access needs /dev/bus/usb, which Docker Desktop on Windows and
    # macOS cannot map — it aborts the whole `up` with "Devices for X are not
    # supported". Keep the base file portable and add the device through
    # docker-compose.usb.yml on Linux hosts:
    #   docker compose -f docker-compose.yml -f docker-compose.usb.yml up -d

  payment:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./payments:/app
      - payment-node_modules:/app/node_modules
    env_file:
      - path: ./payments/.env
        required: false
      - path: ./payments/.env.local
        required: false
      - path: ./.env.local
        required: false
    environment:
      - PAYMENT_PORT=3134
      - PAYMENT_HOST=0.0.0.0
      - PAYMENT_BASE_URL=${VITE_PAYMENT_SERVER_URL:-http://localhost:3134}
      - SURREAL_URL=ws://dbproxy:8000/rpc
      - SURREAL_NS=restaurant_manager
      - SURREAL_DB=restaurant_manager
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - PAYMENT_LOG_LEVEL=debug
      - PAYMENT_ALLOWED_ORIGINS=${PAYMENT_ALLOWED_ORIGINS:-http://localhost:5173}
    command: sh -c "npm install && node server.js"
    ports:
      - "3134:3134"
    depends_on:
      - dbproxy
      - gateway

  sync:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./sync-service:/app
      - sync-node_modules:/app/node_modules
    environment:
      - SYNC_SERVICE_PORT=3136
      - SYNC_SERVICE_HOST=0.0.0.0
      - SYNC_RECONNECT_MS=5000
      - SYNC_LOG_LEVEL=info
      - SYNC_CLIENT_ID=${SYNC_CLIENT_ID:-client-001}
      - SYNC_SOURCE_URL=${SYNC_SOURCE_URL:-ws://dbproxy:8000/rpc}
      - SYNC_SOURCE_NS=${SYNC_SOURCE_NS:-restaurant_manager}
      - SYNC_SOURCE_DB=${SYNC_SOURCE_DB:-restaurant_manager}
      # SYNC_SOURCE_* points at this compose's own surrealdb (the "source" of
      # this branch's changes), so it always reuses SURREAL_USER/SURREAL_PASS
      # rather than needing its own separate credential in .env.
      - SYNC_SOURCE_USER=${SURREAL_USER:?Set SURREAL_USER in .env or .env.local}
      - SYNC_SOURCE_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env or .env.local}
      - SYNC_EXCLUDE_TABLES=${SYNC_EXCLUDE_TABLES:-}
      # SYNC_MASTER_* come from sync-service/.env or .env.local (dotenv).
      # Do not set SYNC_MASTER_URL=${SYNC_MASTER_URL:-} here — an empty value
      # disables sync even when .env.local has a real URL.
    command: sh -c "npm install && node server.js"
    ports:
      - "3136:3136"
    depends_on:
      - dbproxy
    restart: unless-stopped

  tracking:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - path: ./tracking/.env
        required: false
      - path: ./tracking/.env.local
        required: false
      - path: ./.env.local
        required: false
    volumes:
      - ./tracking-api:/app
      - tracking-api-node_modules:/app/node_modules
    environment:
      - TRACKING_PORT=3138
      - TRACKING_HOST=0.0.0.0
      - TRACKING_DB_URL=ws://dbproxy:8000/rpc
      - TRACKING_DB_NS=restaurant_manager
      - TRACKING_DB_NAME=restaurant_manager
      - TRACKING_DB_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - TRACKING_DB_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      # Optional PostgreSQL analytical mirror. Left unset the tracking service
      # behaves exactly as before (SurrealDB alone). Set them, or start the
      # `analytics` profile below, to also copy every event into Postgres.
      - TRACKING_PG_URL=${TRACKING_PG_URL:-}
      - TRACKING_PG_SCHEMA=${TRACKING_PG_SCHEMA:-}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: sh -c "npm install && npm start"
    ports:
      - "3138:3138"
    depends_on:
      - dbproxy
      - gateway

  # The optional PostgreSQL tracking mirror is declared in
  # docker-compose.analytics.yml (run it with -f docker-compose.yml -f that
  # file). Compose interpolates `${VAR:?}` for every service in a file even
  # when a profile hides it, so the mirror's required credentials cannot live
  # here without breaking the default `docker compose up`.

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api:/app
      - api-node_modules:/app/node_modules
    env_file:
      - path: ./api/.env
        required: false
      - path: ./api/.env.local
        required: false
    environment:
      - API_PORT=3140
      - API_HOST=0.0.0.0
      - API_LOG_LEVEL=info
      - API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS:-http://localhost:5173}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-}
      - AI_MONTHLY_LIMIT=${AI_MONTHLY_LIMIT:-}
      - SURREAL_URL=ws://dbproxy:8000/rpc
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
    command: sh -c "npm install && node server.js"
    ports:
      - "3140:3140"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - path: ./gateway/.env
        required: false
      - path: ./gateway/.env.local
        required: false
    volumes:
      - ./gateway:/app
      - gateway-node_modules:/app/node_modules
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=3142
      - GATEWAY_JWT_TTL=${GATEWAY_JWT_TTL:-12h}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - SURREAL_URL=ws://dbproxy:8000/rpc
      - SURREAL_NS=restaurant_manager
      - SURREAL_DB=restaurant_manager
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
    command: sh -c "npm install && node server.js"
    ports:
      # Bind to loopback only: nginx (and the Vite dev proxy) reach the
      # gateway on localhost. Publishing it on all interfaces would let clients
      # hit the gateway directly and spoof X-Forwarded-For to bypass the
      # self-order rate limiter.
      - "${GATEWAY_PORT}:3142"
    depends_on:
      - dbproxy

  backup:
    # Nightly pg_dump of the PostgreSQL database. Retains the latest
    # BACKUP_RETENTION_COUNT dumps in ./backups/postgres.
    image: postgres:16-alpine
    working_dir: /backup
    volumes:
      - ./backups/postgres:/backups
    environment:
      - TZ=UTC
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-restaurant_manager}
      - PGUSER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_RETENTION_COUNT=7
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c '
        set -eu;
        mkdir -p /backups;
        printf "%s\n" "#!/bin/sh" "set -eu" "mkdir -p /backups" "retention=$${BACKUP_RETENTION_COUNT:-7}" "ts=$$(date -u +%Y%m%dT%H%M%SZ)" "file=/backups/postgres-$$ts.dump" "pg_dump -Fc -f \"$$file\"" "ls -1t /backups/postgres-*.dump 2>/dev/null | sed -n \"$$((retention+1)),\\$$p\" | xargs -r rm -f" > /usr/local/bin/run-backup.sh;
        chmod +x /usr/local/bin/run-backup.sh;
        {
          echo "0 0 * * * /usr/local/bin/run-backup.sh";
          echo "0 12 * * * /usr/local/bin/run-backup.sh";
        } > /etc/crontabs/root;
        crond -f -l 8 -L /dev/stdout
      '
    restart: unless-stopped


volumes:
  postgres-data:
  printer-node_modules:
  payment-node_modules:
  sync-node_modules:
  tracking-api-node_modules:
  api-node_modules:
  gateway-node_modules:
