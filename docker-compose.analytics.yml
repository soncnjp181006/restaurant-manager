# Optional PostgreSQL mirror for the tracking / activity log.
#
# Since the full PostgreSQL migration the primary store IS PostgreSQL
# (docker-compose.yml defines the `postgres` service). This overlay now only
# enables the tracking-api SQL mirror: every ingested event is additionally
# written into `tracking_events` on the SAME main PostgreSQL instance, so
# SQL-native analytics can run against a relational copy. If a mirror write
# fails, ingestion still returns 201 and the failure count is exposed on
# `GET /health` as `pgMirrorFailures`.
#
# Usage:
#   1. Set TRACKING_PG_USER and TRACKING_PG_PASS in .env (see .env.example).
#   2. docker compose -f docker-compose.yml -f docker-compose.analytics.yml up -d tracking
#   3. curl http://127.0.0.1:3138/health   -> "pgMirror": "configured"
#
# Without TRACKING_PG_* the tracking service sees an empty TRACKING_PG_URL and
# the mirror stays completely inert (Postgres itself is always on now).

services:
  tracking:
    environment:
      # In-container URL: the service DNS name is `postgres`, port 5432.
      # For running tracking-api on the host instead, use
      #   TRACKING_PG_URL=postgres://<user>:<pass>@127.0.0.1:<POSTGRES_HOST_PORT>/restaurant_manager
      - TRACKING_PG_URL=${TRACKING_PG_URL:-postgresql://${TRACKING_PG_USER:-restaurant}:${TRACKING_PG_PASS}@postgres:5432/${POSTGRES_DB:-restaurant_manager}}
